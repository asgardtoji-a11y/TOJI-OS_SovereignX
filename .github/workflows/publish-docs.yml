name: Publish Documentation to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install any dependencies your docs require
      # (MkDocs, Docusaurus, Sphinx, or custom tooling)
      - name: Install Python (for MkDocs/Sphinx)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install documentation dependencies
        run: |
          if [ -f docs/requirements.txt ]; then
            pip install -r docs/requirements.txt
          fi

      # Build your documentation into a static site
      - name: Build documentation
        run: |
          if [ -f mkdocs.yml ]; then
            mkdocs build --clean --site-dir site
          elif [ -f docs/build.sh ]; then
            bash docs/build.sh
          else
            mkdir site
            cp -r docs/* site/
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
